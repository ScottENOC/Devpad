<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DevPad">
    <title>DevPad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0e0e;
            --surface: #161616;
            --border: #2a2a2a;
            --accent: #e8a045;
            --accent2: #5b9bd5;
            --danger: #d45b5b;
            --success: #5bd48a;
            --text: #d4d0c8;
            --muted: #666;
            --code-bg: #121212;
            --radius: 6px;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Syne', sans-serif;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%; background: var(--bg); color: var(--text);
            font-family: var(--mono); font-size: 13px; overflow: hidden;
        }

        #app { display: flex; flex-direction: column; height: 100dvh; }

        header {
            display: flex; align-items: center; gap: 10px;
            padding: calc(10px + var(--sat)) calc(14px + var(--sar)) 10px calc(14px + var(--sal));
            border-bottom: 1px solid var(--border);
            background: var(--surface); flex-shrink: 0;
        }

        .logo { font-family: var(--sans); font-weight: 800; font-size: 16px; color: var(--accent); letter-spacing: -0.5px; }

        #header-path { flex: 1; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #header-path span { color: var(--text); }

        .workspace { display: flex; flex: 1; overflow: hidden; }

        #sidebar {
            width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
            border-right: 1px solid var(--border); background: var(--surface);
        }

        .sidebar-header { display: flex; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid var(--border); }
        .sidebar-header select {
            flex: 1; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 5px 6px; font-family: var(--mono); font-size: 11px;
        }

        #file-tree { flex: 1; overflow-y: auto; padding: 6px 0; }
        .tree-item {
            display: flex; align-items: center; gap: 6px; padding: 5px 12px; cursor: pointer;
            font-size: 12px; transition: background .1s; white-space: nowrap;
        }
        .tree-item:hover { background: rgba(255,255,255,.04); }
        .tree-item.active { background: rgba(232,160,69,.1); color: var(--accent); }

        #centre { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); }
        .tab { padding: 8px 20px; font-size: 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        #editor-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #editor {
            flex: 1; background: var(--code-bg); color: var(--text); border: none; outline: none;
            font-family: var(--mono); font-size: 13px; padding: 16px; tab-size: 2; white-space: pre; overflow: auto;
        }

        #chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
        #chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 90%; padding: 10px 13px; border-radius: 8px; font-size: 12px; line-height: 1.6; }
        .msg.user { align-self: flex-end; background: rgba(232,160,69,.12); border: 1px solid rgba(232,160,69,.2); }
        .msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }

        #chat-input-area {
            padding: 10px calc(14px + var(--sar)) calc(10px + var(--sab)) calc(14px + var(--sal));
            background: var(--surface); border-top: 1px solid var(--border);
            display: flex; gap: 8px;
        }
        #chat-input {
            flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 12px; font-family: var(--mono); outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">DevPad</div>
            <div id="header-path">/ project / <span>index.html</span></div>
        </header>

        <div class="workspace">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <select id="project-selector"><option>My Project</option></select>
                </div>
                <div id="file-tree"></div>
            </aside>

            <main id="centre">
                <div id="tab-bar">
                    <div class="tab active" onclick="setView('editor')">Editor</div>
                    <div class="tab" onclick="setView('chat')">AI Chat</div>
                </div>

                <div id="editor-view">
                    <textarea id="editor" spellcheck="false"></textarea>
                </div>

                <div id="chat-view" class="hidden">
                    <div id="chat-messages"></div>
                    <div id="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Ask AI about this project...">
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const state = {
            files: {
                'index.html': '<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>',
                'style.css': 'body { background: black; }',
                'js/app.js': 'console.log("ready");'
            },
            activeFile: 'index.html',
            view: 'editor'
        };

        const editor = document.getElementById('editor');
        const fileTree = document.getElementById('file-tree');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        function init() {
            renderTree();
            loadFile(state.activeFile);
            
            chatInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') sendMessage();
            });
        }

        function renderTree() {
            fileTree.innerHTML = Object.keys(state.files).map(path => `
                <div class="tree-item ${path === state.activeFile ? 'active' : ''}" onclick="loadFile('${path}')">
                    ${path}
                </div>
            `).join('');
        }

        function loadFile(path) {
            // Save current
            if (state.activeFile) state.files[state.activeFile] = editor.value;
            
            state.activeFile = path;
            editor.value = state.files[path];
            document.querySelector('#header-path span').textContent = path;
            renderTree();
        }

        function setView(view) {
            state.view = view;
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && view === 'editor') || (i === 1 && view === 'chat')));
            document.getElementById('editor-view').classList.toggle('hidden', view !== 'editor');
            document.getElementById('chat-view').classList.toggle('hidden', view !== 'chat');
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            chatInput.value = '';

            // Construct Iterative Prompt
            const projectStructure = Object.keys(state.files).join('\n');
            const activeContent = state.files[state.activeFile];

            const prompt = `
SYSTEM: You are a coding assistant in DevPad.
PROJECT STRUCTURE:
${projectStructure}

ACTIVE FILE (${state.activeFile}):
${activeContent}

INSTRUCTIONS:
1. If you need to see another file, respond with: READ_FILE: path/to/file
2. To modify a file, respond with: REPLACE_FILE: path/to/file\n\`\`\`\nnew content\n\`\`\`
3. Otherwise, answer concisely.

USER: ${text}`;

            // Simulate API call
            addMessage('ai', "Thinking...");
            
            // Here you would call Gemini API with 'prompt'
            // For now, we simulate a response
            setTimeout(() => {
                const lastMsg = chatMessages.lastElementChild;
                lastMsg.textContent = "I've analyzed the structure. To help further, I'd need to see style.css if you want to change colors. Otherwise, index.html looks good.";
            }, 1000);
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        init();
    </script>
</body>
</html>
